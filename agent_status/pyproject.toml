[project]
name = "agent-status"
version = "0.1.0"
description = "A local status page for agents whose Temporal Workers run on Amazon Bedrock AgentCore Runtime: per agent session, whether a Worker is polling and whether its AgentCore session is alive"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "temporalio>=1.18",
    "boto3>=1.35",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
