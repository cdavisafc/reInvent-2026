# CloudFormation template for the DynamoDB table that AgentCore sessions write their liveness heartbeat to.
AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  DynamoDB table holding one liveness item per AgentCore runtime session, shared by every
  agent's runtimes (each project's session_heartbeat.py) and read by the local status page
  (agent_status/status_page.py), which groups items by their task_queue.

Parameters:
  TableName:
    Type: String
    Default: "agent-session-heartbeats"
    Description: Must match heartbeat_table in agents.toml, and SESSION_HEARTBEAT_TABLE and session-heartbeat-policy.json in each agent project.

Resources:
  SessionHeartbeats:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: session_id
          AttributeType: S
      KeySchema:
        - AttributeName: session_id
          KeyType: HASH
      # Items carry expires_at (last beat + 1 hour); DynamoDB deletes them some time after.
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

Outputs:
  TableName:
    Description: The heartbeat table's name
    Value: !Ref SessionHeartbeats
  TableArn:
    Description: The heartbeat table's ARN
    Value: !GetAtt SessionHeartbeats.Arn
