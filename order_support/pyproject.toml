[project]
name = "order-support-agentcore"
version = "0.1.0"
description = "Order-support multi-agent demo: an OpenAI Agents SDK concierge driving Strands and OpenAI Agents SDK specialists as harness subagents, each Worker serverless on Amazon Bedrock AgentCore Runtime"
requires-python = ">=3.11"
dependencies = [
    # TEMPORARY: resolves to a local activity-sessions build (see override-dependencies) until
    # activity sessions are released; then restore the PyPI floor.
    "temporalio>=1.34.0,<2",
    "temporal-agent-harness[openai-agents,strands-agents]>=0.11.0",
    "bedrock-agentcore>=1.9.1",
    "boto3>=1.35",
    "aws-opentelemetry-distro>=0.22.0",
    # The harness's streaming observer reads ResponseFunctionCallArgumentsDoneEvent.name,
    # which openai 3.9.0 removed; newer versions fail every streamed tool call. 3.8.0 is
    # what the harness itself locks. Same pin as ../react_agent_sessions.
    "openai==3.8.0",
]

[dependency-groups]
# Runs locally: the packaged session manager + HTTP API (`temporal-agent-harness serve` /
# `session-manager`). Not needed in the runtime zip.
local = [
    "temporal-agent-harness[ui]>=0.11.0",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.5.0",
]

[tool.uv]
default-groups = ["local", "dev"]
# The local temporalio wheels only cover macOS and Linux; lock nothing else.
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]
# TEMPORARY: unreleased temporalio with activity sessions, built by ../prerelease/build-local-wheels.sh.
# An override (not a path source) because temporal-agent-harness declares temporalio>=1.35.0 and
# this build is 1.34.0+sessions. See ../react_agent_sessions/README.md, "Building the wheels".
override-dependencies = [
    "temporalio @ file://${PROJECT_ROOT}/../prerelease/wheels/temporalio-1.34.0+sessions-cp310-abi3-manylinux2014_aarch64.manylinux_2_17_aarch64.whl ; sys_platform == 'linux'",
    "temporalio @ file://${PROJECT_ROOT}/../prerelease/wheels/temporalio-1.34.0+sessions-cp310-abi3-macosx_11_0_arm64.whl ; sys_platform == 'darwin'",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
# `agentcore deploy` generates a CDK scaffold here and stages the dependency tree under .cache/.
extend-exclude = ["agentcore"]
