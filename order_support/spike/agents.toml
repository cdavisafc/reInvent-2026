# ABOUTME: Harness registry for the subagent spike, so the UI can start either agent.
# `uv run temporal-agent-harness serve spike/agents.toml --port 8000` from order_support/.

[[agents]]
key = "spike-concierge"
workflow_type = "SpikeConciergeAgent"
task_queue = "spike-concierge"
label = "Spike: Concierge (OpenAI) -> Shipping (Strands)"
schema = "schemas/SpikeConciergeAgent.schema.json"
description = """
The step-1 spike parent: an OpenAI Agents SDK concierge that hands shipping questions to a Strands
shipping subagent on another task queue. Try "Where is order 1042? Expedite it." The expedite call
asks for approval inside the nested Shipping subagent."""

[[agents]]
key = "spike-shipping"
workflow_type = "SpikeShippingAgent"
task_queue = "spike-shipping"
label = "Spike: Shipping (Strands, Claude on Bedrock)"
schema = "schemas/SpikeShippingAgent.schema.json"
description = """
The step-1 spike child, used directly: a Strands agent (Claude on Bedrock) that tracks and expedites
shipments with canned data. Expediting needs your approval."""
